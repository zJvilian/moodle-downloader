[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "moodle-download"
version = "2.0.0"
description = "Download all content from Moodle courses"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "selenium>=4.0.0",
    "requests>=2.28.0",
    "webdriver-manager>=4.0.0",
]

[project.scripts]
moodle-download = "moodle_download.cli:main"

[project.gui-scripts]
moodle-download-ui = "moodle_download.ui:main"

[tool.setuptools.packages.find]
where = ["src"]
